<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>国际信誉 大额无忧</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style id="redpacket-styles">
    * { box-sizing: border-box; margin: 0; padding: 0; text-shadow: none !important; }
    body {
      background: #0a0a0d url("static/img/bg.jpg") center center / cover no-repeat fixed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      min-height: 100vh;
      display: block;
    }
    .app-container { width: 100%; max-width: 500px; background: rgba(15, 15, 22, 0.92); min-height: 100vh; padding: 15px; box-shadow: 0 0 35px rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; gap: 12px; margin: 0 auto; }
    .header-banner { text-align: center; padding: 10px 0; background: linear-gradient(180deg, rgba(226, 189, 78, 0.25) 0%, rgba(0, 0, 0, 0) 100%); border-radius: 10px; border: 1px solid rgba(226, 189, 78, 0.3); }
    .header-title { font-size: 22px; font-weight: bold; color: #fde18f; background: linear-gradient(180deg, #fff2cc 0%, #dfb946 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .lottery-section { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(226, 189, 78, 0.35); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; align-items: center; }
    .lottery-header { width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #e2bd4e; margin-bottom: 15px; font-weight: bold; }
    .timer-container { background-color: #1a1a1a; border: 1px solid #dfb946; border-radius: 6px; padding: 3px 8px; display: flex; align-items: center; color: #fff; }
    .timer-num { color: #ffcc00; font-size: 15px; font-weight: bold; margin: 0 2px; }
    .wheel-container { position: relative; width: 290px; height: 290px; margin: 10px 0 20px 0; display: flex; align-items: center; justify-content: center; }
    .wheel-outer-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, #fce8a6 0%, #b8860b 50%, #fce8a6 100%); box-shadow: 0 0 20px rgba(226, 189, 78, 0.5), inset 0 0 10px rgba(0,0,0,0.8); padding: 10px; }
    .dots-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; border-radius: 50%; pointer-events: none; }
    .dot { position: absolute; width: 8px; height: 8px; background: #fff; border-radius: 50%; box-shadow: 0 0 6px #fff, 0 0 10px #ffcc00; top: 50%; left: 50%; margin: -4px; }
    .pointer { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 32px solid #ff2a2a; z-index: 30; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8)); }
    .pointer::after { content: ''; position: absolute; top: -30px; left: -6px; width: 12px; height: 12px; background: #ffe066; border-radius: 50%; box-shadow: 0 0 8px #fff; }
    .pointer-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; background: radial-gradient(circle, #fff6d5 0%, #dfb946 70%, #997300 100%); border: 3px solid #ffffff; border-radius: 50%; z-index: 25; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #3d1e00; font-size: 13px; box-shadow: 0 0 15px rgba(0, 0, 0, 0.8), inset 0 2px 5px rgba(255,255,255,0.8); cursor: pointer; user-select: none; transition: transform 0.1s; }
    .pointer-center:active { transform: translate(-50%, -50%) scale(0.95); }
    .wheel { width: 100%; height: 100%; border-radius: 50%; position: relative; overflow: hidden; transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1); box-shadow: inset 0 0 15px rgba(0,0,0,0.9); background: conic-gradient(#8b0000 0deg 60deg, #2a0800 60deg 120deg, #8b0000 120deg 180deg, #2a0800 180deg 240deg, #8b0000 240deg 300deg, #2a0800 300deg 360deg); border: 2px solid #dfb946; }
    .sector-label { position: absolute; top: 0; left: 50%; width: 70px; height: 135px; margin-left: -35px; transform-origin: 50% 100%; display: flex; flex-direction: column; align-items: center; padding-top: 15px; font-size: 12px; font-weight: bold; color: #ffe699; pointer-events: none; text-shadow: 0 1px 2px #000 !important; }
    .sector-label span { margin-top: 4px; font-size: 11px; color: #ffffff; }
    .action-group { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .gold-btn { width: 100%; padding: 11px 0; font-size: 15px; font-weight: bold; color: #2b1700; background: linear-gradient(180deg, #ffe89e 0%, #dfb946 100%); border: none; border-radius: 22px; cursor: pointer; box-shadow: 0 4px 12px rgba(223, 185, 70, 0.3); transition: all 0.2s; }
    .gold-btn:disabled { background: #444; color: #888; box-shadow: none; cursor: not-allowed; }
    .history-btn { width: 100%; padding: 10px 0; font-size: 14px; font-weight: bold; color: #fde18f; background: rgba(0, 0, 0, 0.4); border: 1px solid #dfb946; border-radius: 22px; cursor: pointer; text-align: center; transition: background 0.2s; }
    .history-btn:hover { background: rgba(223, 185, 70, 0.15); }
    .status-tips { font-size: 12px; color: #aaa; text-align: center; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); display: flex; align-items: center; justify-content: center; z-index: 99999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .reward-card { background: #180a02; border: 1px solid #3d230b; width: 88%; max-width: 340px; border-radius: 16px; padding: 24px 20px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; align-items: center; position: relative; }
    .reward-header { font-size: 22px; font-weight: bold; color: #ffd833; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .reward-box { width: 100%; border: 2px solid #caa038; border-radius: 12px; background: rgba(35, 18, 5, 0.6); padding: 16px 10px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; }
    .reward-box-text { color: #ff4822; font-size: 20px; font-weight: 900; line-height: 1.35; letter-spacing: 0.5px; white-space: pre-line; }
    .reward-instructions { font-size: 13px; color: #ffffff; line-height: 1.7; margin-bottom: 20px; width: 100%; }
    .reward-instructions p { margin: 2px 0; }
    .reward-instructions .highlight { color: #ffd833; font-weight: bold; }
    .reward-btn { width: 100%; padding: 12px 0; background: linear-gradient(180deg, #fde28f 0%, #e1b43d 100%); color: #2d1b01; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(225, 180, 61, 0.3); }
    .reward-bottom-link { margin-top: 15px; font-size: 13.5px; color: #f7cd46; text-decoration: none; font-weight: bold; display: inline-block; }
    .history-card { background: #15151c; border: 1px solid #dfb946; width: 90%; max-width: 360px; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.9); }
    .history-title { font-size: 18px; color: #fde18f; margin-bottom: 12px; font-weight: bold; text-align: center; }
    .history-list { max-height: 240px; overflow-y: auto; list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .history-item { padding: 10px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(223, 185, 70, 0.3); border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    .history-item:hover { background: rgba(223, 185, 70, 0.15); }
    .modal-btn-group { display: flex; gap: 10px; margin-top: 15px; }
    .modal-close-btn { flex: 1; padding: 8px 0; background: #333; color: #ccc; border: none; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
    <div class="app-container">
        <div class="header-banner"><div class="header-title">国际信誉 大额无忧</div></div>
        <div class="lottery-section">
            <div class="lottery-header"><span>🎉 独家幸运红包转盘</span>
                <div class="timer-container"><span>倒计时</span><span class="timer-num" id="timerHour">01</span>:<span class="timer-num" id="timerMin">45</span>:<span class="timer-num" id="timerSec">30</span></div>
            </div>
            <div class="wheel-container">
                <div class="wheel-outer-ring"><div class="dots-container" id="dotsContainer"></div></div>
                <div class="pointer"></div>
                <div class="pointer-center" id="centerBtnText" onclick="startSpin()">抽奖</div>
                <div class="wheel" id="wheel"></div>
            </div>
            <div class="action-group">
                <button class="gold-btn" id="spinBtn" onclick="startSpin()">开始第 1 次抽奖</button>
                <button class="history-btn" onclick="openHistoryModal()">🏆 我的中奖记录</button>
            </div>
            <div class="status-tips" id="statusTips" style="margin-top: 8px;">已使用 0 / 3 次抽奖机会</div>
        </div>
    </div>

    <!-- 中奖弹窗 -->
    <div class="modal-overlay" id="rewardModal">
        <div class="reward-card">
            <div class="reward-header">🎉 恭喜获得 <span id="rewardNameTitle" style="color:#fff;">特等奖</span></div>
            <div class="reward-box">
                <div class="reward-box-text" id="rewardBoxText">内容加载中...</div>
            </div>
            <div class="reward-instructions" id="rewardInstructions"></div>
            <button class="reward-btn" id="rewardBtn" onclick="closeRewardModal()">我已截图，继续</button>
            <a href="#" class="reward-bottom-link" id="rewardBottomLink" target="_blank">小聊添加老师兑奖 ></a>
        </div>
    </div>

    <!-- 历史记录弹窗 -->
    <div class="modal-overlay" id="historyModal">
        <div class="history-card">
            <div class="history-title">🏆 我的中奖记录</div>
            <ul class="history-list" id="historyList"></ul>
            <div class="modal-btn-group">
                <button class="modal-close-btn" onclick="closeHistoryModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        const prizes = [
            { id: 0, name: "特等奖", boxText: "首存10000包赚3000 \n额外领888红包（包赔/带赚）\n联系上级领取贵族特权", lines: ["请截图保存此画面", "下载任小聊后联系", "<span class='highlight'>楠楠老师账号: 556789 </span> 出示截图领取", "注册服务器输入：<span class='highlight'>s6868</span>"], btnText: "我已截图，继续", bottomLabel: "小聊添加老师兑奖 >", bottomUrl: "https://6749.im/" },
            { id: 1, name: "一等奖", boxText: "首存5000包赚1000 \n额外领628红包（包赔/带赚）\n联系上级领取贵族特权", lines: ["请截图保存此画面", "下载任小聊后联系", "<span class='highlight'>楠楠老师账号: 556789 </span> 出示截图领取", "注册服务器输入：<span class='highlight'>s6868</span>"], btnText: "我已截图，继续", bottomLabel: "小聊添加老师兑奖 >", bottomUrl: "https://6749.im/" },
            { id: 2, name: "二等奖", boxText: "首存2000包赚600 \n额外领288红包（包赔/带赚）\n联系上级领取贵族特权", lines: ["请截图保存此画面", "下载任小聊后联系", "<span class='highlight'>楠楠老师账号: 556789 </span> 出示截图领取", "注册服务器输入：<span class='highlight'>s6868</span>"], btnText: "我已截图，继续", bottomLabel: "小聊添加老师兑奖 >", bottomUrl: "https://6749.im/" },
            { id: 3, name: "三等奖", boxText: "首存1000包赚300 \n额外领188红包（包赔/带赚）", lines: ["请截图保存此画面", "下载任小聊后联系", "<span class='highlight'>楠楠老师账号: 556789 </span> 出示截图领取", "注册服务器输入：<span class='highlight'>s6868</span>"], btnText: "我已截图，继续", bottomLabel: "小聊添加老师兑奖 >", bottomUrl: "https://6749.im/" },
            { id: 4, name: "四等奖", boxText: "首存300包赚100  \n额外领红包 58（包赔/带赚）", lines: ["请截图保存此画面", "下载任小聊后联系", "<span class='highlight'>楠楠老师账号: 556789 </span> 出示截图领取", "注册服务器输入：<span class='highlight'>s6868</span>"], btnText: "我已截图，继续", bottomLabel: "小聊添加老师兑奖 >", bottomUrl: "https://6749.im/" },
            { id: 5, name: "谢谢惠顾", boxText: "每人有三次抽奖机会", lines: ["每周有老玩家带赚", "全程享受包赔模式"], btnText: "可进群看计划.了解百万财富计划", bottomLabel: "小聊添加老师看计划 >", bottomUrl: "https://6749.im/" }
        ];

        let userIP = "127.0.0.1";
        let isSpinning = false;
        let currentSpinCount = 0;
        let spinHistory = [];
        let currentTotalAngle = 0;

        function createDots() {
            const container = document.getElementById('dotsContainer');
            const totalDots = 12;
            for (let i = 0; i < totalDots; i++) {
                const angle = (i * 360) / totalDots;
                const dot = document.createElement('div');
                dot.className = 'dot';
                const radius = 127; 
                const rad = (angle * Math.PI) / 180;
                const x = Math.cos(rad) * radius;
                const y = Math.sin(rad) * radius;
                dot.style.transform = `translate(${x}px, ${y}px)`;
                container.appendChild(dot);
            }
        }

        function initWheelLabels() {
            const wheel = document.getElementById('wheel');
            const prizeNames = ["特等奖", "谢谢惠顾", "四等奖", "三等奖", "二等奖", "一等奖"];
            const prizeSub = ["888元", "多谢参与", "58元", "188元", "288元", "628元"];
            
            for (let i = 0; i < 6; i++) {
                const label = document.createElement('div');
                label.className = 'sector-label';
                const deg = i * 60 + 30; 
                label.style.transform = `rotate(${deg}deg)`;
                label.innerHTML = `<b>${prizeNames[i]}</b><span>${prizeSub[i]}</span>`;
                wheel.appendChild(label);
            }
        }

        async function fetchIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                userIP = data.ip;
            } catch (e) {
                console.warn("IP 获取失败，使用默认标识");
            }
            loadState();
        }

        function loadState() {
            const saved = localStorage.getItem('redpacket_v2_state_' + userIP);
            if (saved) {
                const data = JSON.parse(saved);
                currentSpinCount = data.currentSpinCount || 0;
                spinHistory = data.spinHistory || [];
            }
            updateUI();
        }

        function saveState() {
            localStorage.setItem('redpacket_v2_state_' + userIP, JSON.stringify({ currentSpinCount, spinHistory }));
        }

        function updateUI() {
            const spinBtn = document.getElementById('spinBtn');
            const centerBtnText = document.getElementById('centerBtnText');
            const statusTips = document.getElementById('statusTips');

            if (currentSpinCount >= 3) {
                spinBtn.innerText = "今日抽奖机会已用完";
                spinBtn.disabled = true;
                centerBtnText.innerText = "已完";
                statusTips.innerText = "已使用 3 / 3 次抽奖机会";
            } else {
                spinBtn.innerText = `开始第 ${currentSpinCount + 1} 次抽奖`;
                spinBtn.disabled = false;
                centerBtnText.innerText = "抽奖";
                statusTips.innerText = `已使用 ${currentSpinCount} / 3 次抽奖机会`;
            }
        }

        function startSpin() {
            if (isSpinning) return;
            if (currentSpinCount >= 3) {
                alert("您的抽奖机会已用完！");
                return;
            }

            isSpinning = true;
            currentSpinCount++;
            
            // 简单随机中奖项 (0~5)
            const targetIndex = Math.floor(Math.random() * prizes.length);
            
            // 计算旋转角度：每个扇形 60 度
            const baseCircles = 5; // 转 5 圈
            const anglePerItem = 60;
            // 目标奖项的中心角度偏移
            const targetAngle = baseCircles * 360 + (5 - targetIndex) * anglePerItem + 30;
            
            currentTotalAngle += targetAngle;
            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${currentTotalAngle}deg)`;

            setTimeout(() => {
                isSpinning = false;
                saveState();
                updateUI();
                
                const wonPrize = prizes[targetIndex];
                spinHistory.unshift({
                    name: wonPrize.name,
                    time: new Date().toLocaleTimeString()
                });
                saveState();
                
                openRewardModal(wonPrize);
            }, 4000);
        }

        function openRewardModal(prizeData) {
            document.getElementById('rewardNameTitle').innerText = prizeData.name;
            document.getElementById('rewardBoxText').innerText = prizeData.boxText;
            
            let htmlLines = "";
            prizeData.lines.forEach(line => {
                htmlLines += `<p>${line}</p>`;
            });
            document.getElementById('rewardInstructions').innerHTML = htmlLines;
            document.getElementById('rewardBtn').innerText = prizeData.btnText;
            
            const bottomLink = document.getElementById('rewardBottomLink');
            bottomLink.innerText = prizeData.bottomLabel;
            bottomLink.href = prizeData.bottomUrl;

            document.getElementById('rewardModal').classList.add('active');
        }

        function closeRewardModal() {
            document.getElementById('rewardModal').classList.remove('active');
        }

        function openHistoryModal() {
            const listEl = document.getElementById('historyList');
            listEl.innerHTML = "";
            if (spinHistory.length === 0) {
                listEl.innerHTML = "<li class='history-item' style='text-align:center; color:#888;'>暂无中奖记录</li>";
            } else {
                spinHistory.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'history-item';
                    li.innerHTML = `<b>${item.name}</b> <span style="float:right; color:#aaa; font-size:12px;">${item.time}</span>`;
                    listEl.appendChild(li);
                });
            }
            document.getElementById('historyModal').classList.add('active');
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').classList.remove('active');
        }

        function startTimer() {
            let totalSeconds = 1 * 3600 + 45 * 60 + 30;
            setInterval(() => {
                if (totalSeconds > 0) totalSeconds--;
                const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
                const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
                const s = String(totalSeconds % 60).padStart(2, '0');
                
                document.getElementById('timerHour').innerText = h;
                document.getElementById('timerMin').innerText = m;
                document.getElementById('timerSec').innerText = s;
            }, 1000);
        }

        // 页面初始化
        createDots();
        initWheelLabels();
        fetchIP();
        startTimer();
    </script>
</body>
</html>
